name: Cleanup caches for closed branches

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number whose merge-ref caches should be deleted
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete pull request caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          case "$PULL_REQUEST_NUMBER" in
            ''|*[!0-9]*|0)
              echo "A positive pull request number is required." >&2
              exit 1
              ;;
          esac

          BRANCH="refs/pull/${PULL_REQUEST_NUMBER}/merge"

          echo "Fetching cache IDs for $BRANCH"
          cacheIds=$(gh cache list --ref "$BRANCH" --limit 100 --json id --jq '.[].id')

          echo "Deleting caches..."
          for cacheId in $cacheIds; do
            gh cache delete "$cacheId" || true
          done
          echo "Done"
